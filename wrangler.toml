# KINTAUROS マイページ 保管庫(mypage-vault)
# デプロイは GitHub Actions(.github/workflows/ci.yml)の environment `production` の承認後だけ。開発機からは wrangler deploy しない。
# account_id は書かない(Actions が environment secret の CLOUDFLARE_ACCOUNT_ID を渡す)。
# 公開リポジトリなので、秘密の値・異常を検知する量の上限の値はここに書かない(シークレットと、ダッシュボードで設定する環境変数)。
name = "kintauros-mypage-vault"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = false
# ダッシュボードで設定した環境変数(量の上限など)をデプロイで消さない
keep_vars = true

# 専用ゾーン kintauros-vault.com(保管庫のアカウント)。api の DNS レコード(プロキシ有効)はダッシュボードで作る
routes = [
  { pattern = "api.kintauros-vault.com/*", zone_name = "kintauros-vault.com" }
]

# 保管庫のアカウントで作った D1(2026-10-25 作成。ID は秘密ではない)
[[d1_databases]]
binding = "DB"
database_name = "kintauros-mypage-vault"
database_id = "ddc02773-f85e-46f1-aa23-77d9302a83d1"
migrations_dir = "migrations"

# サイトごとの Durable Object(kintone への同時接続とアプリごとの日次回数。src/gate.js)
[[durable_objects.bindings]]
name = "SITE_GATE"
class_name = "SiteGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SiteGate"]

# 日次: 一時データの掃除・ライセンスの再確認・トークンの権限の再検証(00:45 UTC = 09:45 JST)
[triggers]
crons = ["45 0 * * *"]

[vars]
LICENSE_API_BASE = "https://api.kintauros.com"
# 管理 API のホスト(状態の apiBase に返す)
API_HOST = "api.kintauros-vault.com"
# メンバーの画面のドメイン(サイト・ページの URL を組み立てる。画面側 mypage-worker)
PUBLIC_BASE_DOMAIN = "kintauros.me"
# Google・LINE のリダイレクト先(画面側。設計 V4: 今のまま)
AUTH_HOST = "auth.kintauros.me"
# Google OAuth のクライアント ID(秘密ではない。画面側と同じクライアント。シークレットは保管庫専用の 2 つ目を GOOGLE_CLIENT_SECRET に)
GOOGLE_CLIENT_ID = "62623584312-0362m3dcgpp2dv1vou0k4q732phtjpu4.apps.googleusercontent.com"
# 確認コードのメールの差出人(アドレスだけ使う。表示名はサイト名)
MAIL_FROM = "KINTAUROS マイページ <noreply@kintauros.com>"

# シークレット(値はリポジトリに書かない。保管庫のアカウントのダッシュボード Workers → kintauros-mypage-vault → Settings で登録):
#   VAULT_KEK - ページ DEK・サイト DEK を包む鍵(base64 の 32 バイト。`openssl rand -base64 32`)。未設定だと登録は 503
#               変えると保管庫の全トークン・LINE のシークレットが復号できなくなるので再生成しない
#   VAULT_SESSION_KEY    - メンバーのセッション・自己登録のトークンの署名鍵(base64 の 32 バイト。KEK とは別の値)。未設定だと /v1 は 503
#                          入れ替えると全員のログインが無効になる(漏えいの疑いがあるときは入れ替えてよい)
#   VAULT_FRONT_KEY      - 画面側(mypage-worker)との共有の鍵(32 文字以上。X-Mypage-Front-Key)。防御の根拠ではなく雑多な呼び出し除け。
#                          未設定だと /v1 は 503(画面側を切り替える P4 まで閉じておける)
#   GOOGLE_CLIENT_SECRET - Google OAuth のクライアントシークレット(保管庫専用に追加した 2 つ目。未設定なら Google ログインは無効)
#   RESEND_API_KEY       - 確認コードのメール送信(保管庫専用の送信キー。未設定なら送らない)
#   TURNSTILE_SECRET     - Turnstile のシークレット(未設定なら検証しない)
#
# 環境変数(ダッシュボードで「テキスト」として設定。値はリポジトリに書かない):
#   LIMIT_CODE_FAILS_PER_SITE_HOUR - サイト全体の 1 時間の確認コードの照合の失敗数の上限(超えたらそのサイトの照合を止める。未設定なら検査しない)
#   LIMIT_MEMBER_REQUESTS_PER_MIN  - メンバーごとの 1 分のデータの API の呼び出し回数の上限(必須。未設定ならデータの API は 503)
#   LIMIT_RECORDS_PER_SESSION_HOUR - 1 セッションが 1 時間に取得するレコード数の上限(必須。未設定ならデータの API は 503)
